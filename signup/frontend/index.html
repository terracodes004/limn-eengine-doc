<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limn Engine - Subscribe to Alerts</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(rgba(44, 44, 56, 0.45), rgba(44, 44, 56, 0.45)), url('/signup/frontend/logo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .container {
            background: rgba(25, 25, 35, 0.85);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(235, 59, 90, 0.2);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(235, 59, 90, 0.35);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            cursor: pointer;
        }
        .container.zoomed {
            transform: scale(1.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(235, 59, 90, 0.4);
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #eb3b5a, #ff5252);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        p {
            color: #d0d0e0;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin: 14px 0;
            background: rgba(15, 15, 22, 0.9);
            border: 1px solid rgba(100, 100, 120, 0.5);
            color: #ffffff;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #eb3b5a;
            box-shadow: 0 0 10px rgba(235, 59, 90, 0.3);
            background: rgba(20, 20, 30, 0.95);
        }
        button {
            background: linear-gradient(135deg, #eb3b5a, #c8233f);
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(235, 59, 90, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(235, 59, 90, 0.45);
            background: linear-gradient(135deg, #ff4d6d, #d93855);
        }
        .secondary-btn {
            background: transparent;
            border: 1px solid #eb3b5a;
            color: #ff6b81;
            box-shadow: none;
        }
        .secondary-btn:hover {
            background: rgba(235, 59, 90, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(235, 59, 90, 0.15);
        }
        .hidden { display: none; }
        .error { color: #ff6b6b; margin-top: 10px; font-size: 0.9rem; }
        .success { color: #51cf66; margin-top: 10px; font-size: 0.9rem; }
        #message { margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>🚀 Subscribe for Alerts</h2>
        <p>Draw your game into existence with live updates.</p>

        <div id="step-google">
            <p>Sign in with Google or Email to continue</p>
            <button id="google-login-btn" class="secondary-btn">🔐 Sign in with Google</button>
        </div>

        <div id="step-email" class="hidden">
            <h3>📧 Verify your Email</h3>
            <p>We'll send a verification code to your inbox.</p>
            <input type="email" id="email-input" placeholder="e.g., user@example.com" required>
            <button id="send-email-btn">Send Code</button>
            
            <div id="otp-section" class="hidden">
                <input type="text" id="otp-input" placeholder="Enter verification code">
                <button id="verify-email-btn">Verify & Subscribe</button>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const container = document.getElementById('main-container');
        container.addEventListener('click', (e) => {
            if (['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) return;
            container.classList.toggle('zoomed');
        });
    </script>
    <script type="module" src="./app.js"></script>
</body>
    </html>
