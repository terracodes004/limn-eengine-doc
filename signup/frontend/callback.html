<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Logging you in...</title>
</head>
<body>
    <h2>⏳ Logging you in...</h2>
    <p>Please wait, you will be redirected shortly.</p>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://pjtpesdhjfvcidfkxord.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const redirectTarget = window.location.origin + '/index.html';
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                window.location.href = redirectTarget;
            }
        });

        async function handleCallback() {
            // Check if a session already exists upon loading this callback page
            const { data: { session }, error } = await supabase.auth.getSession();
            
            if (session) {
                window.location.href = redirectTarget;
                return;
            }

            if (error) {
                console.error("Auth session error:", error.message);
            }
        }

        handleCallback();

        
        setTimeout(() => {
        
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    window.location.href = redirectTarget;
                } else {
                    window.location.href = redirectTarget + '?error=login_timeout';
                }
            });
        }, 8000);
    </script>
</body>
</html>
