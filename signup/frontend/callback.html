<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Logging you in...</title>
</head>
<body>
    <h2>⏳ Logging you in...</h2>
    <p>Please wait while we complete your authentication...</p>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://pjtpesdhjfvcidfkxord.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const redirectTarget = window.location.origin + '/index.html';

        async function handleOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const { error } = await supabase.auth.exchangeCodeForSession(code);
                if (error) {
                    console.error("Code exchange error:", error.message);
                    window.location.href = redirectTarget + '?error=' + encodeURIComponent(error.message);
                    return;
                }
            }

            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                window.location.href = redirectTarget;
            } else {
                setTimeout(() => {
                    window.location.href = redirectTarget + '?error=login_failed';
                }, 2000);
            }
        }

        handleOAuthCallback();
    </script>
</body>
</html>
